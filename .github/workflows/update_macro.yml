name: 매시간 매크로 지표 업데이트

on:
  # schedule:
    # 매시간 14분, 29분, 44분, 59분에 실행 (15분 간격 딜레이 방지)
    # - cron: '14,29,44,59 * * * 1-5'
  repository_dispatch:
    types: [force-macro-update] # 👈 외부 강제 호출(Webhook) 수신 기능 추가!
  workflow_dispatch: # 수동 트리거 허용

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 저장소 코드 가져오기
        uses: actions/checkout@v3

      - name: 🐍 파이썬 환경 세팅
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📚 필요 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -U requests beautifulsoup4 yfinance feedparser google-generativeai

      - name: 🚀 데이터 수집 파이썬 실행
        run: |
          mkdir -p public
          python collect_macro.py      # 기존 매크로 데이터 수집
          python generate_backtest.py  # 👈 2번 파일 실행 추가!
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: 🌐 GitHub Gist로 최신 데이터 전송
        run: |
          python -c '
          import json, os, requests
          
          # 전송할 파일 목록
          files_to_upload = ["macro_status.json", "backtest_data.json"]
          
          gist_id = os.environ["GIST_ID"]
          token = os.environ["GIST_TOKEN"]
          
          headers = {
              "Authorization": f"token {token}",
              "Accept": "application/vnd.github.v3+json"
          }
          
          payload = {"files": {}}
          
          for filename in files_to_upload:
              with open(f"public/{filename}", "r", encoding="utf-8") as f:
                  payload["files"][filename] = {"content": f.read()}
          
          r = requests.patch(f"https://api.github.com/gists/{gist_id}", json=payload, headers=headers)
          print("📡 Gist 전송 결과 코드:", r.status_code)
          if r.status_code != 200:
              print("응답 내용:", r.text)
              exit(1)
          '
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}

          # 스케줄러 기상용 더미 주석 2026-06-02