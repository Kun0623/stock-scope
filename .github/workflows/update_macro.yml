name: 매시간 매크로 지표 업데이트

on:
  schedule:
    # 정각 병목을 피해 매시 14분에 실행되도록 수정 (예: 1시 14분, 2시 14분...)
    - cron: '14 * * * 1-5' 
  workflow_dispatch: # 수동 트리거 허용

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 저장소 코드 가져오기
        uses: actions/checkout@v3

      - name: 🐍 파이썬 환경 세팅
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📚 필요 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 yfinance

      - name: 🚀 데이터 수집 파이썬 실행
        run: |
          mkdir -p public   # 👈 [치명적 오류 해결] public 폴더를 강제로 생성하여 FileNotFoundError 방지!
          python collect_macro.py

      - name: 🌐 GitHub Gist로 최신 데이터 전송 (디커플링 배포)
        run: |
          python -c '
          import json, os, requests
          
          # 생성된 로컬 파일 읽기
          with open("public/macro_status.json", "r", encoding="utf-8") as f:
              content = f.read()
              
          gist_id = os.environ["GIST_ID"]
          token = os.environ["GIST_TOKEN"]
          
          headers = {
              "Authorization": f"token {token}",
              "Accept": "application/vnd.github.v3+json"
          }
          payload = {
              "files": {
                  "macro_status.json": {
                      "content": content
                  }
              }
          }
          
          # Gist API를 통해 데이터 오버라이트(PATCH)
          r = requests.patch(f"https://api.github.com/gists/{gist_id}", json=payload, headers=headers)
          print("📡 Gist 전송 결과 코드:", r.status_code)
          if r.status_code != 200:
              print("응답 내용:", r.text)
              exit(1)
          '
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}