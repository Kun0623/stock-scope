name: 매시간 매크로 지표 업데이트

on:
  schedule:
    # 월~금(1-5), 매시 정각(0) 실행 (UTC 기준)
    - cron: '0 * * * 1-5'
  workflow_dispatch: # 깃허브 웹에서 수동 버튼으로도 실행할 수 있게 해주는 옵션

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 저장소 코드 가져오기
        uses: actions/checkout@v3

      - name: 🐍 파이썬 환경 세팅
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📚 필요 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 yfinance

      - name: 🚀 데이터 수집 파이썬 실행
        run: python collect_macro.py

      - name: 💾 업데이트된 JSON 파일 깃허브에 자동 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/macro_status.json
          # 변경사항이 있을 때만 커밋
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 [Auto] 매크로 지표 1시간 단위 자동 업데이트" && git push)